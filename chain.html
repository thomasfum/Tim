<script>
//pulleyDiam=10; 10 is a min

var Example = Example || {};

Example.chains = function() {
    var Engine = Matter.Engine,
        Render = Matter.Render,
        Runner = Matter.Runner,
        Body = Matter.Body,
        Composite = Matter.Composite,
        Composites = Matter.Composites,
        Constraint = Matter.Constraint,
        MouseConstraint = Matter.MouseConstraint,
        Mouse = Matter.Mouse,
        Bodies = Matter.Bodies;

    // create engine
    var engine = Engine.create({
			positionIterations: 6,//default 6
			velocityIterations: 12,//default 4
			constraintIterations:2////default 2
		}),
        world = engine.world;

    // create renderer
    var render = Render.create({
        element: document.body,
        engine: engine,
        options: {
            width: 800,
            height: 600,
            showAngleIndicator: true,
            showCollisions: true,
            showVelocity: true
        }
    });

    Render.run(render);

    // create runner
    var runner = Runner.create();
    Runner.run(runner, engine);
/*
    // add bodies
    var group = Body.nextGroup(true);
        
    var ropeA = Composites.stack(100, 50, 8, 1, 10, 10, function(x, y) {
        return Bodies.rectangle(x, y, 50, 20, { collisionFilter: { group: group } });
    });
    
    Composites.chain(ropeA, 0.5, 0, -0.5, 0, { stiffness: 0.8, length: 2, render: { type: 'line' } });
    Composite.add(ropeA, Constraint.create({ 
        bodyB: ropeA.bodies[0],
        pointB: { x: -25, y: 0 },
        pointA: { x: ropeA.bodies[0].position.x, y: ropeA.bodies[0].position.y },
        stiffness: 0.5
    }));
    */
    group = Body.nextGroup(true);
    let diam=7;
	let nb=24;
	//Matter.Composites.stack(x, y, columns, rows, columnGap, rowGap, callback) 
    var ropeB = Composites.stack(150, 50, nb, 1, diam, diam, function(x, y) {
        //return Bodies.circle(x, y, diam, {/* collisionFilter: { group: group }*/ friction:1,	frictionStatic:0.5*20});
		return Bodies.rectangle(x, y, diam*2,diam*2, {/* collisionFilter: { group: group }*/ friction:1,	frictionStatic:1, mass:0.2,sleepThreshold:2  });
    });
    //Matter.Composites.chain(composite, xOffsetA, yOffsetA, xOffsetB, yOffsetB, options) → Composite
    Composites.chain(ropeB, 0.5, 0, -0.5, 0, { stiffness: 1/*, length: 7*//*diam/2*/, render: { type: 'line' } });
    
	let boxSize=45;
	let BoxA=Bodies.rectangle(ropeB.bodies[0].position.x-boxSize/2-6, 50, boxSize, boxSize,{mass:1});
	let BoxB=Bodies.rectangle(ropeB.bodies[ropeB.bodies.length-1].position.x+boxSize/2+6, 50, boxSize, boxSize,{mass:1});
	
	Composite.add(ropeB, Constraint.create({ 
        bodyA: BoxA,
		bodyB: ropeB.bodies[0],
        pointB: { x: -diam, y: 0 },
        pointA: { x: boxSize/2, y: 0 },
        stiffness: 1
    }));
	
	Composite.add(ropeB, Constraint.create({ 
        bodyA: BoxB,
		bodyB: ropeB.bodies[ropeB.bodies.length-1],
        pointB: { x: +diam, y: 0 },
        pointA: { x: -boxSize/2, y: 0 },
        stiffness: 1,
		//length:2,
		//render: { type: 'line' } 
    }));
	
	
	
	/*
	Composite.add(ropeB, Constraint.create({ 
        bodyB: ropeB.bodies[0],
        pointB: { x: -diam, y: 0 },
        pointA: { x: ropeB.bodies[0].position.x, y: ropeB.bodies[0].position.y },
        stiffness: 0.5
    }));
    */
    group = Body.nextGroup(true);
/*
    var ropeC = Composites.stack(600, 50, 13, 1, 10, 10, function(x, y) {
        return Bodies.rectangle(x - 20, y, 50, 20, { collisionFilter: { group: group }, chamfer: 5 });
    });
    
    Composites.chain(ropeC, 0.3, 0, -0.3, 0, { stiffness: 1, length: 0 });
    Composite.add(ropeC, Constraint.create({ 
        bodyB: ropeC.bodies[0],
        pointB: { x: -20, y: 0 },
        pointA: { x: ropeC.bodies[0].position.x, y: ropeC.bodies[0].position.y },
        stiffness: 0.5
    }));
    
    Composite.add(world, [
        ropeA,
        ropeB,
        ropeC,
        Bodies.rectangle(400, 600, 1200, 50.5, { isStatic: true })
    ]);
*/

	let pulleyDiam=10;
	let pulley1=Bodies.circle(300, 65, pulleyDiam, { isStatic: true });
	//let pulley1=Bodies.polygon(300, 65, 8, pulleyDiam, { isStatic: true }) ;
	let pulley2=Bodies.circle(450, 80, pulleyDiam, { isStatic: true });
	
	/*
	 var constraintPulley1 = Constraint.create({
							pointA: { x: 300, y: 65 },
							bodyB: pulley1,
							length: 0, 
							render: { visible: false }
						});
		*/				

	console.log("ropeB",ropeB);
	//console.log("BoxA",BoxA);
	console.log("pulley2",pulley2);
	
	
    Composite.add(world, [
            ropeB,
			BoxA,
				BoxB,
        Bodies.rectangle(400, 600, 1200, 50.5, { isStatic: true }),
		pulley1,
		pulley2,
		//constraintPulley1
		
    ]);
	
    // add mouse control
    var mouse = Mouse.create(render.canvas),
        mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: {
                    visible: false
                }
            }
        });

    Composite.add(world, mouseConstraint);

	//engine.world.gravity.y = 0;
	engine.enableSleeping =true;
    // keep the mouse in sync with rendering
    render.mouse = mouse;

    // fit the render viewport to the scene
    Render.lookAt(render, {
        min: { x: 0, y: 0 },
        max: { x: 700, y: 600 }
    });

    // context for MatterTools.Demo
    return {
        engine: engine,
        runner: runner,
        render: render,
        canvas: render.canvas,
        stop: function() {
            Matter.Render.stop(render);
            Matter.Runner.stop(runner);
        }
    };
};

Example.chains.title = 'Chains';
Example.chains.for = '>=0.14.2';

if (typeof module !== 'undefined') {
    module.exports = Example.chains;
}
Example.chains(); 

</script>

</body>
