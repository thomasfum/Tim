<!DOCTYPE html>
<html>
<body>

<h1>TIM</h1>
<input type="text" id="levelInput" name="levelInput"><br><br>
<input id="loadLevelButton" type="button" value="Load Level" onclick="loadLevelClicked();" />

<p id="title"></p>
<p id="goal"></p>
<canvas id="myCanvas" width="578" height="369" style="border:1px solid grey"></canvas>
</br>
<input id="refreshButton" type="button" value="Refresh" onclick="refresh(LevelJson);" />
<input id="runButton" type="button" value="Run" onclick="run();" />

<script>
//0,162,162
//https://www.vogons.org/viewtopic.php?p=1089143#p1089143
//https://codeberg.org/knt47/timgres
//https://moddingwiki.shikadi.net/wiki/The_Incredible_Machine_Level_Format




let Images={};
let NBImagesToLoad=0;
let NBImagesLoaded=0;
let LevelJson;
const files={"0":1,
			 "1":8,
			 "2":4,
			 "5":35,
			 "6":2,
			 "8":1,
			 "9":1,
			 "46":8,
			 "47":4,
			 "48":8

};
function flipHorizontally(img,x,y){
	console.log("fliiiiip horizontally");
    // move to x + img's width
    ctx.translate(x+img.width,y);

    // scaleX by -1; this "trick" flips horizontally
    ctx.scale(-1,1);
    
    // draw the img
    // no need for x,y since we've already translated
    ctx.drawImage(img,0,0);
    
    // always clean up -- reset transformations to default
    ctx.setTransform(1,0,0,1,0,0);
}

function flipVertically(img,x,y){

	//console.log("fliiiiip vertically");
    // move to y + img's height
    ctx.translate(x,y+img.height);

    // scaleY by -1; this "trick" flips vertically
    ctx.scale(1,-1);
    
    // draw the img
    // no need for x,y since we've already translated
    ctx.drawImage(img,0,0);
    
    // always clean up -- reset transformations to default
    ctx.setTransform(1,0,0,1,0,0);
}

function drawImage(img,x,y,flipV){

	if(flipV==0)
		ctx.drawImage(img, x, y);
	else
		flipVertically(img, x, y);

}

function AllImagesLoaded(json)
{
	console.log("All images loaded: "+NBImagesLoaded) ;
	refresh(json);
}
function refresh(json)
{
	json.Parts.forEach(part => {
		let start=part.name.indexOf('(');
		let end=part.name.indexOf(')');
		let result = part.name.substring(start+1, end);
		//console.log(part);
		if(part.in_partsbin==0)
		{
			let flipH=0;
			let flipV=0;
			if(part.direction_r_to_l!=undefined)
			{
				let start=part.direction_r_to_l.indexOf('(');
				let end=part.direction_r_to_l.indexOf(')');
				flipV = part.direction_r_to_l.substring(start+1, end);
				//console.log("flipV="+flipV);
								
			}
			if(part.appearance==undefined)
			{
				if(part.width>Images[result+"_0"].width)
				{
					//dupliquer en width
					//console.log("w:"+part.width+" / "+Images[result+"_0"].width);
					for (let index = 0; index < part.width/Images[result+"_0"].width; ++index) 
					{
						if(index==0)
							drawImage(Images[result+"_0"], part.pos_x+Images[result+"_0"].width*index, part.pos_y,flipV);
						else if(index==part.width/Images[result+"_0"].width-1)
							drawImage(Images[result+"_3"], part.pos_x+Images[result+"_0"].width*index, part.pos_y,flipV);
						else
						{
							if(index%2==0)
								drawImage(Images[result+"_1"], part.pos_x+Images[result+"_0"].width*index, part.pos_y,flipV);
							else
								drawImage(Images[result+"_2"], part.pos_x+Images[result+"_0"].width*index, part.pos_y,flipV);
						}
					}
				}else
				if(part.height>Images[result+"_0"].height)
				{
					//dupliquer en height
					//console.log("h:"+part.height+" / "+Images[result+"_0"].height);
					for (let index = 0; index < part.height/Images[result+"_0"].height; ++index) 
					{
						if(index==0)
							drawImage(Images[result+"_4"], part.pos_x, part.pos_y+Images[result+"_0"].height*index,flipV);
						else if(index==part.height/Images[result+"_0"].height-1)
							drawImage(Images[result+"_7"], part.pos_x, part.pos_y+Images[result+"_0"].height*index,flipV);
						else
						{
							if(index%2==0)
								drawImage(Images[result+"_5"], part.pos_x, part.pos_y+Images[result+"_0"].height*index,flipV);
							else
								drawImage(Images[result+"_6"], part.pos_x, part.pos_y+Images[result+"_0"].height*index,flipV);
						}
					}
				}
				else
				{
					drawImage(Images[result+"_0"], part.pos_x, part.pos_y,flipV);
				}
			}
			else
			{
				let start=part.appearance.indexOf('(');
				let end=part.appearance.indexOf(')');
				let subResult = part.appearance.substring(start+1, end);
				//console.log(result+"_"+subResult);
				drawImage(Images[result+"_"+subResult], part.pos_x, part.pos_y,flipV);	
			}
		}
	});
	
		
}

function loadImage(filename,json)
{
	NBImagesToLoad++;
	//console.log("load: "+filename) ;
	Images[filename] = new Image();  
		  Images[filename].src = './images/'+filename+".png";  
		  Images[filename].onload = () => {  
			NBImagesLoaded++;
			if(NBImagesLoaded==NBImagesToLoad)
				AllImagesLoaded(json);
		  };
}			

function ReadJson(json)
{
	LevelJson=json;
	//console.log(json);
	document.getElementById("title").innerHTML = json.Title;
	document.getElementById("goal").innerHTML = json.Goal;
	NBImagesToLoad=0;
	NBImagesLoaded=0;
	Images={};
	json.Parts.forEach(part => {
		let start=part.name.indexOf('(');
		let end=part.name.indexOf(')');
		let result = part.name.substring(start+1, end);
		//console.log(part.name +" =>"+result+":"+files[result]) ;
		for (let index = 0; index < files[result]; ++index) 
		{
			let filename=result+"_"+index;
			//console.log("imag="+Images[filename]);
			if(Images[filename]==undefined)
			{
				Images[filename]=0;
				loadImage(filename,json);
			}
		}
	});
}



function LoadLevel(level)
{
	console.log("loading level "+level);
	ctx.fillStyle = "rgba(0,162,162,255)";
	ctx.fillRect(0, 0, c.width, c.height);
	
	fetch('./levels/level'+level+'.json')
		.then((response) => response.json())
		.then((json) => ReadJson(json));
}

function loadLevelClicked()
{
	let l=document.getElementById("levelInput").value;
	LoadLevel(l);
}

function run()
{
	console.log("run!");
}

	const c = document.getElementById("myCanvas");
	const ctx = c.getContext("2d");
	
	
	LoadLevel(1);
	
</script>

</body>
</html>
