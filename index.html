	function flipHorizontally(img,x,y){
		console.log("fliiiiip horizontally");
		// move to x + img's width
		ctx.translate(x+img.width,y);

		// scaleX by -1; this "trick" flips horizontally
		ctx.scale(-1,1);
		
		// draw the img
		// no need for x,y since we've already translated
		ctx.drawImage(img,0,0);
		
		// always clean up -- reset transformations to default
		ctx.setTransform(1,0,0,1,0,0);
	}

	function flipVertically(img,x,y){

		//console.log("fliiiiip vertically");
		// move to y + img's height
		ctx.translate(x,y+img.height);

		// scaleY by -1; this "trick" flips vertically
		ctx.scale(1,-1);
		
		// draw the img
		// no need for x,y since we've already translated
		ctx.drawImage(img,0,0);
		
		// always clean up -- reset transformations to default
		ctx.setTransform(1,0,0,1,0,0);
	}
	function flipBoth(img,x,y){

		//console.log("fliiiiip vertically");
		// move to y + img's height
		ctx.translate(x+img.width,y+img.height);

		// scaleY by -1; this "trick" flips vertically
		ctx.scale(-1,-1);
		
		// draw the img
		// no need for x,y since we've already translated
		ctx.drawImage(img,0,0);
		
		// always clean up -- reset transformations to default
		ctx.setTransform(1,0,0,1,0,0);
	}

	function drawImage(img,x,y,flipV,flipH){

		if((flipV==0)&&(flipH==0))
			ctx.drawImage(img, x, y);
		else if((flipV==1)&&(flipH==0))
			flipVertically(img, x, y);
		else if((flipV==0)&&(flipH==1))
			flipHorizontally(img,x,y);
		else
			flipBoth(img,x,y);
	}

	function AllImagesLoaded()

	function refresh(json, allObjects)
	{
		//console.log("Refresh "+allObjects);
		if(allObjects==true)
		{
			ctx.fillStyle = "rgba(0,162,162,255)";
			ctx.fillRect(0, 0, canvas.width, canvas.height);
		}
		partsbin={};
		let partsbinPosY=0;
		json.Parts.forEach(part => {
			//console.log(part);
			if(part.in_partsbin==0)
			{
			
				if((allObjects==true)||((allObjects==false)&&(part.is_moving==0)))
				{
				
					let flipH=0;
					let flipV=0;
					if(part.direction_r_to_l!=undefined)
					{
						let start=part.direction_r_to_l.indexOf('(');
						let end=part.direction_r_to_l.indexOf(')');
						flipV = part.direction_r_to_l.substring(start+1, end);
						//console.log("flipV="+flipV);
					}
					
					if(part.orientation!=undefined)
					{
						//console.log("orientation");
						let start=part.orientation.indexOf('(');
						let end=part.orientation.indexOf(')');
						flipH = part.orientation.substring(start+1, end);
						//console.log("flipH="+flipH);
					}
					
					if(part.appearance==undefined)
					{
						if((part.width>Images[part.TimType+"-0"].width)&&(part.size==undefined))
						{
							//dupliquer en width
							for (let index = 0; index < part.width/Images[part.TimType+"-0"].width; ++index) 
							{
								if(index==0)
									drawImage(Images[part.TimType+"-0"], part.pos_x+Images[part.TimType+"-0"].width*index, part.pos_y,flipV,flipH);
								else if(index==part.width/Images[part.TimType+"-0"].width-1)
									drawImage(Images[part.TimType+"-3"], part.pos_x+Images[part.TimType+"-0"].width*index, part.pos_y,flipV,flipH);
								else
								{
									if(index%2==0)
										drawImage(Images[part.TimType+"-1"], part.pos_x+Images[part.TimType+"-0"].width*index, part.pos_y,flipV,flipH);
									else
										drawImage(Images[part.TimType+"-2"], part.pos_x+Images[part.TimType+"-0"].width*index, part.pos_y,flipV,flipH);
								}
							}
						}
						else if((part.height>Images[part.TimType+"-0"].height)&&(part.size==undefined))
						{

							//dupliquer en height
							//console.log("h:"+part.height+" / "+Images[part.TimType+"-0"].height);
							for (let index = 0; index < part.height/Images[part.TimType+"-0"].height; ++index) 
							{
								if(index==0)
									drawImage(Images[part.TimType+"-4"], part.pos_x, part.pos_y+Images[part.TimType+"-0"].height*index,flipV,flipH);
								else if(index==part.height/Images[part.TimType+"-0"].height-1)
									drawImage(Images[part.TimType+"-7"], part.pos_x, part.pos_y+Images[part.TimType+"-0"].height*index,flipV,flipH);
								else
								{
									if(index%2==0)
										drawImage(Images[part.TimType+"-5"], part.pos_x, part.pos_y+Images[part.TimType+"-0"].height*index,flipV,flipH);
									else
										drawImage(Images[part.TimType+"-6"], part.pos_x, part.pos_y+Images[part.TimType+"-0"].height*index,flipV,flipH);
								}
							}
						}
						else
						{
							if((part.anim==undefined)||(part.anim==0))
								drawImage(Images[part.TimType+"-0"], part.pos_x, part.pos_y,flipV,flipH);
							else
							{
								drawImage(Images[part.TimType+"-"+part.animStep], part.pos_x, part.pos_y,flipV,flipH);
								part.animDelay++;
								if(part.animDelay>10)
								{
									part.animDelay=0;
									part.animStep++;
									if(part.animStep>=files[part.TimType].count)
										part.animStep=0;
								}
							}
						}
					}
					else
					{
						let start=part.appearance.indexOf('(');
						let end=part.appearance.indexOf(')');
						let subResult = part.appearance.substring(start+1, end);
						//console.log(part.TimType+"_"+subResult);
						drawImage(Images[part.TimType+"-"+subResult], part.pos_x, part.pos_y,flipV,flipH);	
					}
				}
			}else//part.in_partsbin==1
			{
				part.canBeDragged=1;
				if(partsbin[part.TimType]==undefined)
				{
					partsbin[part.TimType]={};
					partsbin[part.TimType].count=1;
					let x=playgroundOffsetX+playgroundWidth+40-Icons[part.TimType].width/2;
					let y=playgroundOffsetY+partsbinPosY+30
					part.pos_x=x;
					part.pos_y=y;
					partsbin[part.TimType].pos_x=playgroundOffsetX+playgroundWidth+40;
					partsbin[part.TimType].pos_y=y;
					partsbin[part.TimType].height=Icons[part.TimType].height;
					drawImage(Icons[part.TimType],x, y,0,0);	
					partsbinPosY+=Icons[part.TimType].height;
					partsbinPosY+=30;
				}
				else
					partsbin[part.TimType].count++;
			}
		});
		
		//display number in bin
		for(var key in partsbin)
		{
			ctx.font = "10px Arial";
			ctx.fillStyle = "purple";
			if (partsbin.hasOwnProperty(key))
			{
				var value=partsbin[key];
				//console.log(key+" = ",value);
				ctx.fillText(value.count,value.pos_x-5,value.pos_y+value.height+15);
			}
		}
		
	}

	function loadImage(filename,json,part,imgType)
	{
		NBImagesToLoad++;
		//console.log("load: "+filename) ;
		Images[filename] = new Image();  
		part.Images[filename]=Images[filename];
		if(imgType==0)
			Images[filename].src = './images/PARTS/PART'+filename+".png";  
		else
			Images[filename].src = './images/'+filename+".png";  
		Images[filename].onload = () => {  
			NBImagesLoaded++;
		
			if(NBImagesLoaded==NBImagesToLoad)
				AllImagesLoaded();
		};
	}			

	function loadIcon(filename)
	{
		NBIconsToLoad++;
		//console.log("load: "+filename) ;
		Icons[filename] = new Image();  
		Icons[filename].src = './images/ICONS-BMP/ICONS-'+filename+".png";  
		Icons[filename].onload = () => {  
			NBIconsLoaded++;
		
			if(NBIconsLoaded==NBIconsToLoad)
			{
				console.log("All icons loaded: "+NBIconsLoaded) ;
				refresh(LevelJson,true);
			}
		};
	}	


	function ReadJson(json)
	{
		LevelJson=json;
		//console.log(json);
		document.getElementById("title").innerHTML = json.Title;
		document.getElementById("goal").innerHTML = json.Goal;
		NBImagesToLoad=0;
		NBImagesLoaded=0;
		NBIconsToLoad=0;
		NBIconsLoaded=0;
		Images={};
		partsbin={};
		json.Parts.forEach(part => {
			let start=part.name.indexOf('(');
			let end=part.name.indexOf(')');
			let result = part.name.substring(start+1, end);
			part.TimType=result;
			part.movingObj=undefined;
			part.Images={};
			//console.log(part.name +" =>"+result+":"+files[result]) ;
			//console.log(part);
			for (let index = 0; index < files[result].count; ++index) 
			{
				let filename=result+"-"+index;
				//console.log("imag="+Images[filename]);
				if(Images[filename]==undefined)
				{
					Images[filename]=0;
					loadImage(filename,json,part,0);
				}
				else
					part.Images[filename]=Images[filename];
				
				if(part.in_partsbin==1)
				{
					if(Icons[result]==undefined)
					{
						Icons[result]=0;
						loadIcon(result);
					}
				}
			}
		});
	}



	function LoadLevel(level)
	{
		stop();
		cleanPhysics();
		console.log("loading level "+level);
		
		ctx.fillStyle = "rgba(0,162,162,255)";
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		
		fetch('./levels/level_'+level+'.json')
			.then((response) => response.json())
			.then((json) => ReadJson(json));
	}

	function loadLevelClicked()
	{
		let l=document.getElementById("levelInput").value;
		LoadLevel(l);
	}

			LevelJson.Parts[collision.bodyA.TimNo].anim=true;
			LevelJson.Parts[collision.bodyA.TimNo].animStep=1;
			LevelJson.Parts[collision.bodyA.TimNo].animDelay=0;
		}
		if(LevelJson.Parts[collision.bodyB.TimNo].TimType==6)
		{
			console.log("anim mouse "+LevelJson.Parts[collision.bodyA.TimNo].no);
			LevelJson.Parts[collision.bodyB.TimNo].anim=true;
			LevelJson.Parts[collision.bodyB.TimNo].animStep=1;
			LevelJson.Parts[collision.bodyB.TimNo].animDelay=0;
		}	

		});
		
	});
	
	
	//--------------------------------------------------
	// run
	//--------------------------------------------------
	function cleanPhysics()
	{
		const allBody= [];
		engine.world.bodies.forEach((body)=>{
			if((body.isStatic==false)&&(body.isSleeping == false))
			{
				allBody.push(body);
			}
		});
		World.remove(world, allBody);
	}
	//--------------------------------------------------
	// stop
	//--------------------------------------------------
	function stop()
	{
		Render.stop(render)
		if(runner!=undefined)
			Runner.stop(runner);
	}
	//--------------------------------------------------
	// run
	//--------------------------------------------------
	function run()
	{
		console.log("run! "+engine.world.gravity.y);
		
		//clean the World
		cleanPhysics();
		engine.world.gravity.y = 0;
		LevelJson.Parts.forEach(part => {
			let start=part.name.indexOf('(');
			let end=part.name.indexOf(')');
			let result = part.name.substring(start+1, end);
			
			if(part.in_partsbin==0)
			{
				console.log(part);
				if(part.is_moving)
				{
					var restitution=files[result].restitution;
					if(restitution==undefined)
						restitution=0;
					var mass=files[result].mass;
					if(mass==undefined)
						mass=0;
						
					var movingObj = Bodies.circle(part.pos_x+part.Images[part.TimType+"-0"].width/2, part.pos_y+part.Images[part.TimType+"-0"].height/2,  part.Images[part.TimType+"-0"].width/2, {
						part:part,
						TimNo:part.no,
						isSleeping: false,
						isStatic: false,
						restitution: restitution, 
						//	density:mass, 
						mass2:mass,
						render: {
						  sprite: { texture: part.Images[part.TimType+"-0"].src/*, 
						  xScale: ratio,
						  yScale: ratio,
						  */
						  }
						  }
						  });
					/*	  
					if(mass==-1)
					{
						console.log("apply force");
						  Body.applyForce(movingObj, movingObj.position, { x: 0 , y: -0.040-world.gravity.y-0.05 })
						  }
						  */
					//Body.setMass(movingObj, mass);
					
					World.add(world, [movingObj]);
					part.movingObj=movingObj;
				}
				else
				{
					var staticObj = Bodies.rectangle(part.pos_x+part.width/2,part.pos_y+part.height/2, part.width, part.height, {
						isStatic: true, 
						part:part,
						TimNo:part.no,
						render: { fillStyle: "rgba(0, 0, 255, 0)" }
						});
					World.add(world, [staticObj]);
				}
			}
		});
		Render.run(render);
		runner=Runner.create()
		Runner.run(runner, engine);
	}
	

	function MouseClickUp(e){
		canvas.onmousemove = null;
		DraggingObject=undefined;
		document.getElementById("myCanvas").style.cursor="";
	}
	
	function MouseClickDown(e){
		Xclick=e.pageX-canvas.offsetLeft;
		Yclick=e.pageY-canvas.offsetTop;
		// On ne lance le déplacement onmousemove que si
		// le click est dans l'objet
		LevelJson.Parts.forEach(part => {
			if(part.canBeDragged==1)
			{
				let dx=part.width;
				let dy=part.height;
				if(Xclick>playgroundOffsetX+playgroundWidth)
				{
					console.log("in bin");
					dx=Icons[part.TimType].width;
					dy=Icons[part.TimType].height;
				}
				if((Xclick>part.pos_x)&&(Xclick<part.pos_x+dx)&&(Yclick>part.pos_y)&&(Yclick<part.pos_y+dy))
				{
					document.getElementById("myCanvas").style.cursor="grabbing";
					canvas.onmousemove = Move;
					console.log("Drag "+part.no);
					DraggingObject=part;
					if(part.in_partsbin==1)
					{
						part.in_partsbin=0;
						console.log("drag=",part);
					}
				}
			}
		});	

	}
	function Move(e)
	{
//	  console.log(DraggingObject);
	  DraggingObject.pos_x=e.pageX-canvas.offsetLeft-DraggingObject.width/2;
	  DraggingObject.pos_y=e.pageY-canvas.offsetTop-DraggingObject.height/2;
	  refresh(LevelJson,true);
	}

	LoadLevel(1);
